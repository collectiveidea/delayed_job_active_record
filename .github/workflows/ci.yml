name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Every adapter against every Rails version on one current Ruby
  adapters:
    name: Test (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ${{ matrix.adapter }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        rails: ['6.0', '6.1', '7.0', '7.1', '7.2', '8.0', '8.1', edge]
        adapter: [sqlite3, postgresql, mysql2, trilogy]
        include:
          - ruby: '4.0'
            ubuntu: latest
          # EOL Active Record still supported on Ruby >= 3.2
          - rails: '6.0'
            ruby: '3.2'
            ubuntu: '22.04'
          - rails: '6.1'
            ruby: '3.2'
            ubuntu: '22.04'

    continue-on-error: ${{ matrix.rails == 'edge' }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delayed_job_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: delayed_job_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4
    - name: Select the gemfile
      env:
        ADAPTER: ${{ matrix.adapter }}
        RAILS_VERSION: ${{ matrix.rails }}
      run: |
        gemfile=$([ "$RAILS_VERSION" = edge ] && echo master || echo "${RAILS_VERSION/./-}")
        echo "BUNDLE_GEMFILE=$GITHUB_WORKSPACE/gemfiles/$ADAPTER/$gemfile.gemfile" >> "$GITHUB_ENV"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rspec
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.adapter }}
        parallel: true
        # Don't fail otherwise-green jobs when coveralls.io has an outage
        fail-on-error: false

  # Every Ruby against every Rails version it supports, on SQLite
  rubies:
    name: Test (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', ruby-head]
        rails: ['7.0', '7.1', '7.2', '8.0', '8.1', edge]
        adapter: [sqlite3]
        exclude:
          # Rails edge requires Ruby >= 3.3.1
          - ruby: '3.2'
            rails: edge

    continue-on-error: ${{ matrix.rails == 'edge' || endsWith(matrix.ruby, 'head') }}

    steps:
    - uses: actions/checkout@v4
    - name: Select the gemfile
      env:
        ADAPTER: ${{ matrix.adapter }}
        RAILS_VERSION: ${{ matrix.rails }}
      run: |
        gemfile=$([ "$RAILS_VERSION" = edge ] && echo master || echo "${RAILS_VERSION/./-}")
        echo "BUNDLE_GEMFILE=$GITHUB_WORKSPACE/gemfiles/$ADAPTER/$gemfile.gemfile" >> "$GITHUB_ENV"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rspec
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.adapter }}
        parallel: true
        # Don't fail otherwise-green jobs when coveralls.io has an outage
        fail-on-error: false

  # The JDBC adapters only support some Rails versions, and there is no
  # JDBC adapter for Trilogy
  jruby:
    name: Test (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}, ${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby-10.0, jruby-head]
        rails: ['7.0', '7.1', '7.2', '8.0', '8.1']
        adapter: [sqlite3, postgresql, mysql2]
        exclude:
          # Only activerecord-jdbcsqlite3-adapter supports Rails 8.1,
          # and only via its 81.0.pre1 prerelease
          - rails: '8.1'
            adapter: postgresql
          - rails: '8.1'
            adapter: mysql2
          - ruby: jruby-head
            adapter: postgresql
          - ruby: jruby-head
            adapter: mysql2

    continue-on-error: ${{ endsWith(matrix.ruby, 'head') }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delayed_job_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: delayed_job_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4
    - name: Select the gemfile
      env:
        ADAPTER: ${{ matrix.adapter }}
        RAILS_VERSION: ${{ matrix.rails }}
      run: |
        gemfile=$([ "$RAILS_VERSION" = edge ] && echo master || echo "${RAILS_VERSION/./-}")
        echo "BUNDLE_GEMFILE=$GITHUB_WORKSPACE/gemfiles/$ADAPTER/$gemfile.gemfile" >> "$GITHUB_ENV"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rspec
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.rails }}-${{ matrix.adapter }}
        parallel: true
        # Don't fail otherwise-green jobs when coveralls.io has an outage
        fail-on-error: false

  # Rubies older than 3.2 against the Rails versions they support. Rails 3.0
  # through 4.1 run on Ruby 2.1, the oldest supported Ruby. Active Record
  # before 4.2.6 doesn't work with PostgreSQL 12 or later, so this job keeps
  # older database servers.
  legacy:
    name: Test (Ruby ${{ matrix.ruby }}, Gemfile ${{ matrix.gemfile }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.1'
            gemfile: gemfiles/postgresql/3-0.gemfile
            ubuntu: '22.04'
            docker: true
          - ruby: '2.1'
            gemfile: gemfiles/postgresql/3-1.gemfile
            ubuntu: '22.04'
            docker: true
          - ruby: '2.1'
            gemfile: gemfiles/postgresql/3-2.gemfile
            ubuntu: '22.04'
            docker: true
          - ruby: '2.1'
            gemfile: gemfiles/postgresql/4-0.gemfile
            ubuntu: '22.04'
            docker: true
          - ruby: '2.1'
            gemfile: gemfiles/postgresql/4-1.gemfile
            ubuntu: '22.04'
            docker: true
          - ruby: '2.1'
            gemfile: gemfiles/sqlite3/3-0.gemfile
            ubuntu: '22.04'
          - ruby: '2.1'
            gemfile: gemfiles/sqlite3/3-1.gemfile
            ubuntu: '22.04'
          - ruby: '2.1'
            gemfile: gemfiles/sqlite3/3-2.gemfile
            ubuntu: '22.04'
          - ruby: '2.1'
            gemfile: gemfiles/sqlite3/4-0.gemfile
            ubuntu: '22.04'
          - ruby: '2.1'
            gemfile: gemfiles/sqlite3/4-1.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/mysql2/4-2.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/mysql2/5-0.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/postgresql/4-2.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/postgresql/5-0.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/sqlite3/4-2.gemfile
            ubuntu: '22.04'
          - ruby: '2.4'
            gemfile: gemfiles/sqlite3/5-0.gemfile
            ubuntu: '22.04'
          - ruby: '2.5'
            gemfile: gemfiles/mysql2/5-1.gemfile
            ubuntu: '22.04'
          - ruby: '2.5'
            gemfile: gemfiles/postgresql/5-1.gemfile
            ubuntu: '22.04'
          - ruby: '2.5'
            gemfile: gemfiles/sqlite3/5-1.gemfile
            ubuntu: '22.04'
          - ruby: '2.7'
            gemfile: gemfiles/mysql2/7-1.gemfile
            ubuntu: latest
          - ruby: '2.7'
            gemfile: gemfiles/postgresql/7-1.gemfile
            ubuntu: latest
          - ruby: '2.7'
            gemfile: gemfiles/sqlite3/7-1.gemfile
            ubuntu: latest
          - ruby: '2.7'
            gemfile: gemfiles/trilogy/7-1.gemfile
            ubuntu: latest
          - ruby: '3.0'
            gemfile: gemfiles/mysql2/7-1.gemfile
            ubuntu: latest
          - ruby: '3.0'
            gemfile: gemfiles/postgresql/7-1.gemfile
            ubuntu: latest
          - ruby: '3.0'
            gemfile: gemfiles/sqlite3/7-1.gemfile
            ubuntu: latest
          - ruby: '3.0'
            gemfile: gemfiles/trilogy/7-1.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/mysql2/7-1.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/mysql2/7-2.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/postgresql/7-1.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/postgresql/7-2.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/sqlite3/7-1.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/sqlite3/7-2.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/trilogy/7-1.gemfile
            ubuntu: latest
          - ruby: '3.1'
            gemfile: gemfiles/trilogy/7-2.gemfile
            ubuntu: latest

    services:
      postgres:
        image: postgres:11-alpine
        env:
          POSTGRES_DB: delayed_job_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: delayed_job_test
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      if: ${{ !matrix.docker }}
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      if: ${{ !matrix.docker }}
      run: bundle exec rspec
    - name: Run tests in a Ruby ${{ matrix.ruby }} container
      if: ${{ matrix.docker }}
      # setup-ruby's Ruby 2.1 is built against OpenSSL 1.0, and the old pg gem
      # crashes it by loading Ubuntu 22.04's libpq, which links OpenSSL 3, so
      # build pg in the Debian image that Ruby 2.1 shipped with instead
      run: >-
        docker run --rm --network host -v "$GITHUB_WORKSPACE:/app" -w /app
        -e LANG=C.UTF-8 -e BUNDLE_GEMFILE=/app/${{ matrix.gemfile }}
        ruby:${{ matrix.ruby }} bash -c "bundle install --jobs 4 && bundle exec rspec"
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.gemfile }}
        parallel: true
        # Don't fail otherwise-green jobs when coveralls.io has an outage
        fail-on-error: false

  finish:
    needs: [adapters, rubies, jruby, legacy]
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
        fail-on-error: false
